services:
  postgres:
    image: postgres:16-alpine
    container_name: conciergeiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-concierge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concierge_secret}
      POSTGRES_DB: ${POSTGRES_DB:-concierge_iq}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-concierge} -d ${POSTGRES_DB:-concierge_iq}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conciergeiq-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-concierge}:${POSTGRES_PASSWORD:-concierge_secret}@postgres:5432/${POSTGRES_DB:-concierge_iq}
      GUEST_APP_URL: ${GUEST_APP_URL:-http://localhost:5173}
      DASHBOARD_APP_URL: ${DASHBOARD_APP_URL:-http://localhost:5174}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
    ports:
      - '3000:3000'

volumes:
  postgres_data:
