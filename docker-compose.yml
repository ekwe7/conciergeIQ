version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: conciergeiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-concierge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concierge_secret}
      POSTGRES_DB: ${POSTGRES_DB:-concierge_iq}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Stage 2: Redis
  # redis:
  #   image: redis:7-alpine
  #   container_name: conciergeiq-redis
  #   restart: unless-stopped
  #   ports:
  #     - '6379:6379'
  #   volumes:
  #     - redis_data:/data

volumes:
  postgres_data:
