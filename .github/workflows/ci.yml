# =============================================================================
# CI Pipeline — Runs on every push to main and on pull requests targeting main.
# Purpose: Validate code quality, type safety, and correctness before merging.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # A real PostgreSQL for the integration tests (tenant isolation, check-out, payments...).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: concierge
          POSTGRES_PASSWORD: concierge_secret
          POSTGRES_DB: concierge_iq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U concierge -d concierge_iq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://concierge:concierge_secret@localhost:5432/concierge_iq_test

    steps:
      # Step 1: Pull the latest code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install pnpm (the package manager used by this monorepo)
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Step 3: Set up Node.js and enable pnpm's dependency cache for faster installs
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # Step 4: Install all workspace dependencies using the lockfile (no updates allowed)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 5: Enforce module boundary rules — prevents packages from importing
      #         things they shouldn't (e.g. apps importing from other apps)
      - name: Check dependency boundaries
        run: pnpm run lint:deps

      # Step 6: Run ESLint across the entire monorepo to catch code style
      #         and potential bug issues
      - name: Lint
        run: pnpm run lint

      # Step 7: Run the TypeScript compiler in check mode across all packages
      #         to ensure there are no type errors
      - name: Typecheck
        run: pnpm run typecheck

      # Step 8: Run all unit, architecture and integration tests across the monorepo.
      #         The test setup applies database migrations before the first test.
      - name: Run tests
        run: pnpm run test

      # Step 9: Build all packages to verify the project compiles successfully
      - name: Build
        run: pnpm run build
